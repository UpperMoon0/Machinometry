plugins { id 'fabric-loom' version '1.6-SNAPSHOT'; id 'java' }
group = 'com.nstut'; version = '0.1.0'
base { archivesName = 'machinometry-fabric-1.20.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
sourceSets {
    main.java.srcDirs += ['../../shared/core/src/main/java']
    main.resources.srcDirs += ['../../shared/resources']
    test.java.srcDirs += ['../../shared/core/src/test/java']
}
repositories { mavenCentral(); maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.6+1.20.1'
    modImplementation 'team.reborn:energy:3.0.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}
tasks.named('test') { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.release = 17 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
