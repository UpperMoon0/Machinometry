plugins { id 'net.fabricmc.fabric-loom' version '1.16.3'; id 'java' }
group = 'com.nstut'; version = '0.1.0'
base { archivesName = 'machinometry-fabric-26.1.2' }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
sourceSets {
    main.java.srcDirs += ['../../shared/core/src/main/java']
    main.resources.srcDirs += ['../../shared/resources']
    test.java.srcDirs += ['../../shared/core/src/test/java']
}
repositories { mavenCentral(); maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.155.2+26.1.2'
    implementation 'team.reborn:energy:5.0.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}
tasks.named('test') { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
